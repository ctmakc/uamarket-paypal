# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# On top of docker-compose.yml:
#   - Caddy is the only thing published on the host (80 and 443) and gets TLS for SHOP_DOMAIN
#     automatically. It sends /webhooks/stripe to the API and everything else to the storefront.
#   - The API, the database and the storefront have no host port.
#   - Every long-running service restarts on failure, after a reboot and after a plain stop
#     (`restart: always`, since 17.09.2026: `unless-stopped` left a service down for good once
#     anybody, or any script, had stopped it by hand).
#   - The database password and the internal proxy secret must come from the env file.
#   - A backup service dumps the database and the photo volume every night and keeps 14 days.
#   - Mailpit is not started: production mail goes to the SMTP provider in the env file.
# Runbook: docs/LAUNCH-RUNBOOK.md.

x-restart: &restart
  restart: always

services:
  db:
    <<: *restart
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}

  app:
    <<: *restart
    ports: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://heritage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/heritage
      MEDIA_ROOT: /app/media
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?set INTERNAL_PROXY_SECRET (openssl rand -hex 32)}
      ALLOW_INSECURE_DEV: "false"
    # Uvicorn believes proxy headers only from itself: every real request arrives from web or
    # Caddy over the compose network, and the client address travels in X-Client-IP behind
    # INTERNAL_PROXY_SECRET instead (app/services/ratelimit.py).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1"]

  scheduler:
    <<: *restart
    environment:
      DATABASE_URL: postgresql+psycopg://heritage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/heritage

  web:
    <<: *restart
    ports: !reset []
    environment:
      API_URL: http://app:8000
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?set INTERNAL_PROXY_SECRET}

  mailpit:
    profiles: ["local-mail"]

  caddy:
    image: caddy:2.10-alpine
    <<: *restart
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN, e.g. shop.example.ca}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?set INTERNAL_PROXY_SECRET}
      # Empty in production (a real certificate from Let's Encrypt). "tls internal" for a local
      # rehearsal with Caddy's own certificate authority.
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    <<: *restart
    command: ["sh", "/scripts/pg-backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: heritage
      PGDATABASE: heritage
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-7}
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups
      - media_data:/media:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  backups:
